# ============================================================
# .tmux.conf — Giuseppe Kali workflow
# Optimized for: pentest, CTF, Claude Code dual-pane workflow
# ============================================================

# -----------------------------------------------------------
# 1. Settings di base
# -----------------------------------------------------------
# Terminale a 256 colori + true color (per Dracula, Catppuccin, ecc.)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",screen-256color:RGB"

# Mouse abilitato per:
# - selezione testo → copia automatica in clipboard
# - resize pane trascinando i bordi
# - click su pane per cambiare focus
# - scroll con rotella
set -g mouse on

# History più lunga (Claude Code/scan output sono verbosi)
set -g history-limit 100000

# Window e pane numbering parte da 1 (più comodo da tastiera)
set -g base-index 1
setw -g pane-base-index 1

# Rinumera automaticamente le window dopo close
set -g renumber-windows on

# Riduci escape-time (default 500ms = lag con vim/nvim)
set -g escape-time 0

# Activity monitoring (notifica quando un pane in background ha output)
setw -g monitor-activity on
set -g visual-activity off

# Focus events per nvim/vim (auto-reload file, etc)
set -g focus-events on

# -----------------------------------------------------------
# 2. Mode keys: usa vi-style in copy-mode
# -----------------------------------------------------------
setw -g mode-keys vi

# -----------------------------------------------------------
# 3. Reload veloce della config
# -----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "✓ tmux config reloaded"

# -----------------------------------------------------------
# 4. Split pane: usa | e - (manteniamo cwd corrente)
# -----------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Nuova window mantiene cwd
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------
# 5. Navigazione pane vim-style (senza prefix per veloce)
# -----------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# -----------------------------------------------------------
# 6. Copy mode bindings (vi-style)
# -----------------------------------------------------------
# Entra in copy mode con prefix + [
# Esci con q o Esc
# In copy mode:
#   v       → inizia selezione
#   y       → copia (+ esci)
#   Ctrl+v  → toggle rectangle (block) selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Selezione mouse: quando rilasci il drag, copia automaticamente
# nella clipboard di SISTEMA (non --primary di linux)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Doppio click → seleziona parola
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Triplo click → seleziona riga intera
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Click singolo (fuori da copy mode) → entra in copy mode + cambia pane
# (utile per scroll up con rotella senza dover premere prefix prima)
# NB: questo è gestito automaticamente da `mouse on` + `mode-keys vi`

# -----------------------------------------------------------
# 7. Status bar — base (Dracula la sovrascriverà)
# -----------------------------------------------------------
set -g status-position bottom
set -g status-interval 1
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# -----------------------------------------------------------
# 8. Plugin (TPM) — TPM va dichiarato qui in mezzo,
#    eseguito alla fine
# -----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults (consigliato da tmux-plugins)
set -g @plugin 'tmux-plugins/tmux-sensible'

# Logging: prefix + Shift+P → start/stop log del pane in file
# prefix + Alt+P → screen capture, prefix + Alt+Shift+P → save full history
set -g @plugin 'tmux-plugins/tmux-logging'

# Salvataggio/ripristino sessioni
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Estrai velocemente path/url/IP/hash dall'output (prefix + Tab)
set -g @plugin 'laktak/extrakto'
set -g @extrakto_clip_tool 'xclip -selection clipboard'
set -g @extrakto_grab_area 'window recent'

# Tema Dracula — full feature set
set -g @plugin 'dracula/tmux'

# ===========================================================
# PALETTE "HACKER MATRIX NEON" — dev/cyberpunk vibe
# Pure black background + neon vividi ad alta saturazione.
# Verde matrix, cyan elettrico, magenta hot, viola neon, lime acid.
# Mantiene i nomi della palette Dracula (richiesto dal plugin)
# ma li ridefinisce su scala neon-on-black.
# ===========================================================
set -g @dracula-colors "
white='#e0ffe6'
gray='#1a1a1f'
dark_gray='#0a0a0d'
light_purple='#bd00ff'
dark_purple='#7000ff'
cyan='#00ffff'
green='#00ff41'
orange='#ff8700'
red='#ff003c'
pink='#ff00aa'
yellow='#d7ff00'
"

# Plugin moduli attivi nella status bar (ordine = ordine di visualizzazione)
# Flusso: MULLVAD → VPN(tun0 IP) → CPU → RAM → GIT → TIME
# - custom:mullvad.sh: 🛡 XX (country code) quando Mullvad up, hidden quando down
# - network-vpn verbose: IP della tun0 (HTB) quando up, hidden quando down
# Auto-heal symlink: lo script vive in ~/.tmux/scripts/ ma Dracula lo cerca
# dentro la sua scripts dir → symlink ri-creato su ogni reload config
run-shell 'ln -sf /home/parallels/.tmux/scripts/mullvad.sh /home/parallels/.tmux/plugins/tmux/scripts/mullvad.sh'
set -g @dracula-plugins "custom:mullvad.sh network-vpn cpu-usage ram-usage git time"

# --- Label e colori per modulo (formato: "fg-color bg-color") ---
# Tutti i bg = dark_gray (#0a0a0d, near-black) per massimo contrasto
# fg = neon vivido, ogni modulo ha il suo accento

# Custom plugins (Mullvad): green su nero, match shield del statusline Claude
set -g @dracula-custom-plugin-colors "green dark_gray"

set -g @dracula-network-vpn-label " tun0 "
set -g @dracula-network-vpn-verbose true
set -g @dracula-network-vpn-colors "cyan dark_gray"

set -g @dracula-cpu-usage-label " CPU"
set -g @dracula-cpu-usage-colors "pink dark_gray"

set -g @dracula-ram-usage-label " RAM"
set -g @dracula-ram-usage-colors "yellow dark_gray"

set -g @dracula-ip-address-colors "cyan dark_gray"

set -g @dracula-git-colors "green dark_gray"
set -g @dracula-git-show-current-symbol "✓"
set -g @dracula-git-show-diff-symbol "!"
set -g @dracula-git-no-repo-message ""
set -g @dracula-git-no-untracked-files true

set -g @dracula-time-colors "light_purple dark_gray"
set -g @dracula-time-format " %a %d/%m %R"

# Tempo / date
set -g @dracula-show-fahrenheit false
set -g @dracula-show-timezone false
set -g @dracula-military-time true
set -g @dracula-day-month true

# Aspetto generale
set -g @dracula-show-powerline true

# ===========================================================
# LEFT-ICON full custom — Deathly Hallows + Hacker Prompt
# ===========================================================
# Componenti (renderizzati left→right):
#   1. △ animato     → rotating Deathly Hallows (script hallows.sh)
#                      frames: △ ◬ ▲ ◭ ▽ ▼ (1 fps)
#   2. ❯ / ⚠ modal   → arrow normale, lampeggia ⚠ rosso quando
#                      hai premuto prefix (client_prefix=1)
#   3. #h hostname   → cyan
#   4. ▶ #S session  → giallo acid
#   5. ◇ Np pane#    → magenta (numero pane nella window corrente)
# Tutti i colori in inline style #[fg=...] per look multi-color
# Left-icon: keep the green Dracula blob TIGHT around the Hallows triangle +
# braille spinner (compact "running" indicator), then close it and render
# the rest on the dark bar background for contrast.
set -g @dracula-show-left-icon "#[fg=#0a0a0d,bold] #[default] #{?client_prefix,#[fg=#ff003c#,bold]⚠ PFX,#[fg=#00ff41#,bold]❯}#[default] #[fg=#d7ff00,bold]#S#[default] #[fg=#ff00aa] #{window_panes}#[default]"
set -g @dracula-left-icon-padding 1
set -g @dracula-border-contrast true
set -g @dracula-show-flags true
set -g @dracula-show-empty-plugins false
set -g @dracula-refresh-rate 5
set -g @dracula-show-edge-icons true

# Highlight pane attivo / window inattive
set -g @dracula-inactive-window-status-style "dim"

# === Rifiniture HACKER MATRIX su pane/mode/messaggi ===
# Palette neon-on-black:
#   void #0a0a0d | dim #1a1a1f | text #e0ffe6
#   matrix-green #00ff41 | cyan #00ffff | magenta #ff00aa
# Bordo pane attivo in matrix-green, inattivi grigio scuro
set -g pane-border-style "fg=#1a1a1f"
set -g pane-active-border-style "fg=#7000ff,bold"

# Numeri "display-panes" (prefix + q): viola dark_purple per coerenza con bordi
set -g display-panes-colour "#7000ff"
set -g display-panes-active-colour "#7000ff"

# Mode (copy mode + selezione testo): viola elettrico su nero
set -g mode-style "fg=#e0ffe6,bg=#bd00ff,bold"
set -g message-style "fg=#00ff41,bg=#0a0a0d,bold"
set -g message-command-style "fg=#00ffff,bg=#0a0a0d,bold"

# Status bar di base in nero pieno (riempi gap tra moduli powerline)
set -g status-style "bg=#0a0a0d,fg=#00ff41"

# -----------------------------------------------------------
# 9. ⚠ TPM run: deve essere SEMPRE l'ultima riga
# -----------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'

# -----------------------------------------------------------
# 10. Override post-Dracula
#     Dracula sovrascrive questi valori al caricamento;
#     ri-applicati QUI per avere precedenza finale.
# -----------------------------------------------------------
set -g status-interval 1
set -g status-right-length 100
set -g status-style "bg=#0a0a0d,fg=#00ff41"
set -g pane-active-border-style "fg=#7000ff,bold"
set -g pane-border-style "fg=#1a1a1f"

# Recolor status-left blob: Dracula hard-codes the matrix-green for the
# left-icon powerline blob. Swap to light_purple so the LEFT side matches
# the active window indicator color.
run-shell 'tmux set -g status-left "$(tmux show-options -gv status-left | sed "s/#00ff41/#7000ff/g")"'
